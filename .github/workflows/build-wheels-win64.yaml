name: build-wheels-win64

on:
  push:
    branches:
      - wheel
  workflow_dispatch:

env:
  SHERPA_ONNX_IS_IN_GITHUB_ACTIONS: 1

concurrency:
  group: build-wheels-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels_win64:
    name: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Update version
        shell: bash
        run: |
          ./new-release.sh
          git diff .

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        shell: bash
        run: |
          pip install setuptools wheel delvewheel

          python3 setup.py bdist_wheel

          ls -lh ./dist/

      # delvewheel = the Windows analogue of auditwheel. It walks the
      # wheel's embedded .pyd / .exe / .dll files, finds every transitive
      # native DLL they import (onnxruntime.dll, sherpa-onnx-c-api.dll,
      # vcruntime140.dll, anything CMake produced that wasn't already
      # listed in cmake_extension.py's get_binaries()), and copies them
      # into a private kroko_onnx.libs/ directory inside the wheel — then
      # patches the wheel's loader so pip install lands them where Windows
      # can find them at runtime. Without this step the wheel can install
      # OK but fail at first import or first `kroko-onnx-online-websocket-
      # server.exe` invocation with "library not found".
      #
      # --add-path tells delvewheel where to look for DLLs that aren't
      # already on the system PATH — the CMake build drops everything in
      # build/<...>/sherpa_onnx/bin during setup.py bdist_wheel. Use
      # `find` so we don't hardcode the build temp dir's Python-version
      # suffix.
      - name: Repair wheel (bundle native DLLs)
        shell: bash
        run: |
          mkdir -p wheelhouse
          # Collect every CMake-produced "bin" dir under build/ as a search
          # path. delvewheel accepts ; as separator on Windows.
          DLL_PATHS=$(find build -type d -name bin 2>/dev/null \
              | tr '\n' ';' | sed 's/;$//')
          echo "delvewheel --add-path: $DLL_PATHS"
          for whl in dist/*.whl; do
            python -m delvewheel repair \
              --add-path "$DLL_PATHS" \
              --wheel-dir wheelhouse \
              "$whl"
          done
          ls -lh wheelhouse/

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/
          echo "---"
          echo "Inspecting bundled DLLs in the repaired wheel:"
          # unzip the first wheel and list its DLL payload so the CI log
          # makes it obvious that onnxruntime + sherpa DLLs are in there.
          python -m zipfile -l ./wheelhouse/*.whl | grep -iE '\.(dll|pyd|exe)$' || true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl

      - name: Publish to huggingface
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        uses: nick-fields/retry@v3
        with:
          max_attempts: 20
          timeout_seconds: 200
          shell: bash
          command: |
            git config --global user.email "csukuangfj@gmail.com"
            git config --global user.name "Fangjun Kuang"

            rm -rf huggingface
            export GIT_LFS_SKIP_SMUDGE=1
            export GIT_CLONE_PROTECTION_ACTIVE=false

            SHERPA_ONNX_VERSION=$(grep "SHERPA_ONNX_VERSION" ./CMakeLists.txt  | cut -d " " -f 2  | cut -d '"' -f 2)
            echo "SHERPA_ONNX_VERSION $SHERPA_ONNX_VERSION"

            d=cpu/$SHERPA_ONNX_VERSION

            git clone https://csukuangfj:$HF_TOKEN@huggingface.co/csukuangfj/sherpa-onnx-wheels huggingface
            cd huggingface
            git fetch
            git pull
            git merge -m "merge remote" --ff origin main

            mkdir -p $d

            cp -v ../wheelhouse/*.whl $d/

            git status
            git add .
            git commit -m "add more wheels"
            git push https://csukuangfj:$HF_TOKEN@huggingface.co/csukuangfj/sherpa-onnx-wheels main

      - name: Publish wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python3 -m pip install --upgrade pip
          if [[ ${{ matrix.python-version }} == "3.7" ]]; then
            python3 -m pip install wheel twine setuptools
          else
            python3 -m pip install wheel twine==5.0.0 setuptools
          fi

          twine upload ./wheelhouse/*.whl
